<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Igor Gudaniec | Front-End Developer</title>
  <meta name="description" content="Igor Gudaniec, Front-End Developer i inżynier z Gdańska. Projekty, doświadczenie i kontakt.">
  <meta name="theme-color" content="#08090d">
  <meta property="og:title" content="Igor Gudaniec | Front-End Developer">
  <meta property="og:description" content="Portfolio: projekty, doświadczenie i kontakt.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2308090d'/%3E%3Ctext x='50%25' y='56%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial,sans-serif' font-size='28' font-weight='700' fill='%235eead4'%3EIG%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    document.documentElement.classList.add("js");
    // zabezpieczenie: gdyby intro się zawiesiło, pokaż stronę po kilku sekundach
    setTimeout(function () { document.documentElement.classList.add("is-loaded"); }, 4500);
  </script>
</head>
<body id="top">
  <a class="skip-link" href="#main" data-i18n="nav.skip"></a>

  <!-- ===== Intro (ekran ładowania) ===== -->
  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader-top"><span>portfolio</span><span>gdańsk · pl</span></div>
    <div class="preloader-name"><span class="pl-line"><span>Igor</span></span><span class="pl-line"><span>Gudaniec</span></span></div>
    <div class="preloader-bottom">
      <div class="preloader-bar"><span id="preloader-bar"></span></div>
      <span class="preloader-count" id="preloader-count">00</span>
    </div>
  </div>

  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="noise" aria-hidden="true"></div>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <!-- ===== Nawigacja ===== -->
  <header class="header" id="header">
    <nav class="container nav">
      <a href="#top" class="logo" data-magnetic="0.3"><span class="logo-mark">IG</span><span class="logo-text" data-profile="name"></span></a>

      <ul class="nav-links" id="nav-links">
        <li><a href="#about"><span class="num">01</span><span data-i18n="nav.about"></span></a></li>
        <li><a href="#projects"><span class="num">02</span><span data-i18n="nav.projects"></span></a></li>
        <li><a href="#experience"><span class="num">03</span><span data-i18n="nav.experience"></span></a></li>
        <li><a href="#contact"><span class="num">04</span><span data-i18n="nav.contact"></span></a></li>
      </ul>

      <div class="nav-right">
        <div class="lang-switch" role="group" aria-label="Język / Language">
          <button type="button" data-lang="pl" aria-pressed="true">PL</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="nav-links" data-i18n-aria="nav.menu"><span></span></button>
      </div>
    </nav>
  </header>

  <main id="main">
    <!-- ===== Start ===== -->
    <section class="hero" id="hero">
      <canvas class="hero-canvas" id="network" aria-hidden="true"></canvas>

      <div class="container hero-grid">
        <div class="hero-content">
          <div data-intro style="--delay: .05s"><span class="status"><span class="status-dot"></span><span data-i18n="hero.status"></span></span></div>
          <p class="hero-greeting" data-intro style="--delay: .15s" data-i18n="hero.greeting"></p>
          <h1 class="hero-name" id="hero-name"></h1>
          <p class="hero-role" data-intro style="--delay: .8s">
            <span class="sr-only" id="roles-sr"></span>
            <span aria-hidden="true"><span class="role-prompt">&gt;</span> <span id="role-text"></span><span class="caret"></span></span>
          </p>
          <p class="hero-text" data-intro style="--delay: .9s" data-i18n="hero.text"></p>
          <div class="hero-actions" data-intro style="--delay: 1s">
            <a href="#projects" class="btn btn-primary" data-magnetic><span data-i18n="hero.cta1"></span><i data-icon="arrow-down"></i></a>
            <a href="#contact" class="btn btn-ghost" data-magnetic><span data-i18n="hero.cta2"></span></a>
          </div>
          <div class="socials" data-socials data-intro style="--delay: 1.1s"></div>
        </div>

        <div class="hero-visual" data-intro style="--delay: .6s">
          <div class="hero-visual-inner" id="hero-visual">
            <div class="terminal" data-tilt="6">
              <div class="terminal-bar"><i></i><i></i><i></i><span class="terminal-title" data-i18n="terminal.title"></span></div>
              <div class="terminal-body" id="terminal" aria-hidden="true"></div>
            </div>
            <span class="float-chip chip-a" data-depth="26"><span><b style="--c: #ff2d20"></b>Laravel 13</span></span>
            <span class="float-chip chip-b" data-depth="40"><span><b style="--c: #61dafb"></b>React 19</span></span>
            <span class="float-chip chip-c" data-depth="32"><span><b style="--c: #a259ff"></b>Figma</span></span>
          </div>
        </div>
      </div>

      <a href="#about" class="scroll-cue" data-intro style="--delay: 1.3s"><span data-i18n="hero.scroll"></span><i></i></a>
    </section>

    <!-- ===== Paski z technologiami ===== -->
    <div class="marquee" aria-hidden="true">
      <div class="marquee-row"><div class="marquee-track" id="marquee-1"></div></div>
      <div class="marquee-row alt"><div class="marquee-track" id="marquee-2"></div></div>
    </div>

    <!-- ===== O mnie ===== -->
    <section class="section about" id="about">
      <div class="container">
        <div class="section-head" data-reveal="head">
          <span class="section-bg-num" data-parallax="60" aria-hidden="true">01</span>
          <p class="section-label"><span class="section-num">01</span><span data-i18n="about.label"></span></p>
          <h2 class="section-title" data-i18n="about.title" data-split></h2>
        </div>

        <p class="statement" id="statement" data-i18n="about.statement" data-words></p>

        <div class="about-grid">
          <div class="about-text" data-reveal>
            <p data-i18n="about.p1"></p>
            <p data-i18n="about.p2"></p>
            <dl class="facts" id="facts"></dl>
          </div>
          <div class="stats" id="stats" data-stagger></div>
        </div>

        <div class="sub-head" data-reveal="head">
          <p class="section-label"><span class="section-num">//</span><span data-i18n="about.stackLabel"></span></p>
          <h3 class="sub-title" data-i18n="about.stackTitle" data-split></h3>
        </div>
        <div class="bento" id="bento" data-spotlight data-stagger></div>
      </div>
    </section>

    <!-- ===== Projekty ===== -->
    <section class="section projects" id="projects">
      <div class="container">
        <div class="section-head" data-reveal="head">
          <span class="section-bg-num" data-parallax="60" aria-hidden="true">02</span>
          <p class="section-label"><span class="section-num">02</span><span data-i18n="projects.label"></span></p>
          <h2 class="section-title" data-i18n="projects.title" data-split></h2>
          <p class="section-sub" data-i18n="projects.sub"></p>
        </div>
        <div class="projects-stack" id="projects-stack"></div>
      </div>
    </section>

    <!-- ===== Doświadczenie ===== -->
    <section class="section experience" id="experience">
      <div class="container">
        <div class="section-head" data-reveal="head">
          <span class="section-bg-num" data-parallax="60" aria-hidden="true">03</span>
          <p class="section-label"><span class="section-num">03</span><span data-i18n="experience.label"></span></p>
          <h2 class="section-title" data-i18n="experience.title" data-split></h2>
        </div>

        <div class="tl-filters" id="tl-filters" role="group" data-reveal>
          <span class="tl-pill" aria-hidden="true"></span>
          <button type="button" data-filter="all" aria-pressed="true" data-i18n="experience.all"></button>
          <button type="button" data-filter="work" aria-pressed="false" data-i18n="experience.work"></button>
          <button type="button" data-filter="edu" aria-pressed="false" data-i18n="experience.edu"></button>
        </div>

        <div class="timeline-wrap">
          <div class="tl-line" aria-hidden="true"><span class="tl-progress"></span></div>
          <ol class="timeline" id="timeline" data-stagger></ol>
        </div>

        <div class="sub-head" data-reveal="head">
          <p class="section-label"><span class="section-num">//</span><span>certs</span></p>
          <h3 class="sub-title" data-i18n="experience.certs" data-split></h3>
        </div>
        <div class="certs" id="certs" data-spotlight data-stagger></div>

        <a class="btn btn-ghost cv-btn" id="cv-btn" href="#" download hidden><i data-icon="download"></i><span data-i18n="experience.cv"></span></a>
      </div>
    </section>

    <!-- ===== Kontakt ===== -->
    <section class="section contact" id="contact">
      <div class="container">
        <p class="section-label" data-reveal><span class="section-num">04</span><span data-i18n="contact.label"></span></p>
        <div class="contact-head">
          <h2 class="contact-title" data-i18n="contact.title" data-chars data-reveal="head"></h2>
          <a class="round-badge" id="round-badge" href="#contact-form" data-magnetic="0.25" data-reveal style="--d: 200ms" data-i18n-aria="form.title">
            <svg viewBox="0 0 200 200" aria-hidden="true">
              <defs><path id="badge-circle" d="M100,100 m-80,0 a80,80 0 1,1 160,0 a80,80 0 1,1 -160,0"/></defs>
              <text><textPath href="#badge-circle" id="badge-text"></textPath></text>
            </svg>
            <span class="round-badge-icon"><i data-icon="arrow-down"></i></span>
          </a>
        </div>

        <div class="contact-grid">
          <div class="contact-main" data-reveal>
            <p class="contact-text" data-i18n="contact.text"></p>
            <a class="contact-email" id="contact-email" href="#"><span data-profile="email"></span><i data-icon="arrow-up-right"></i></a>
            <div class="contact-actions">
              <button type="button" class="btn btn-ghost" id="copy-btn" data-magnetic><i data-icon="copy"></i><span id="copy-label" data-i18n="contact.copy"></span></button>
              <div class="socials" data-socials></div>
            </div>
          </div>

          <!-- formularz: wiadomości idą na e-mail przez FormSubmit (ustawienia w js/data.js) -->
          <div class="form-card" data-reveal style="--d: 150ms">
            <form class="contact-form" id="contact-form" novalidate>
              <h3 class="form-title" data-i18n="form.title"></h3>

              <fieldset class="topic-group">
                <legend data-i18n="form.topic"></legend>
                <div class="topics">
                  <label class="topic"><input type="radio" name="topic" value="job" checked><span data-i18n="form.topics.job"></span></label>
                  <label class="topic"><input type="radio" name="topic" value="project"><span data-i18n="form.topics.project"></span></label>
                  <label class="topic"><input type="radio" name="topic" value="other"><span data-i18n="form.topics.other"></span></label>
                </div>
              </fieldset>

              <div class="field-row">
                <div class="field">
                  <input id="f-name" name="name" type="text" autocomplete="name" maxlength="100" placeholder=" " required aria-describedby="f-name-error">
                  <label for="f-name" data-i18n="form.name"></label>
                  <p class="field-error" id="f-name-error"></p>
                </div>
                <div class="field">
                  <input id="f-email" name="email" type="email" autocomplete="email" maxlength="150" placeholder=" " required aria-describedby="f-email-error">
                  <label for="f-email" data-i18n="form.email"></label>
                  <p class="field-error" id="f-email-error"></p>
                </div>
              </div>

              <div class="field">
                <textarea id="f-message" name="message" rows="5" maxlength="3000" placeholder=" " required aria-describedby="f-message-error"></textarea>
                <label for="f-message" data-i18n="form.message"></label>
                <div class="field-meta">
                  <p class="field-error" id="f-message-error"></p>
                  <span class="char-count" id="char-count" aria-hidden="true"></span>
                </div>
              </div>

              <!-- pułapka na boty: ludzie tego pola nie widzą -->
              <input type="text" name="_honey" class="honey" tabindex="-1" autocomplete="off" aria-hidden="true">

              <div class="form-footer">
                <p class="form-note" data-i18n="form.note"></p>
                <button type="submit" class="btn btn-primary form-submit" id="form-submit"><span class="form-submit-label" data-i18n="form.send"></span><i data-icon="send"></i><span class="spinner" aria-hidden="true"></span></button>
              </div>
              <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
            </form>

            <div class="form-success" id="form-success" hidden>
              <svg class="success-check" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-15"/></svg>
              <h3 data-i18n="form.successTitle"></h3>
              <p data-i18n="form.successText"></p>
              <button type="button" class="btn btn-ghost" id="form-again" data-i18n="form.again"></button>
            </div>
          </div>
        </div>

        <div class="contact-meta" data-reveal>
          <span><i data-icon="map-pin"></i><span data-i18n="contact.location"></span></span>
          <span><i data-icon="clock"></i><b id="clock">--:--</b>&nbsp;<span data-i18n="contact.time"></span></span>
          <span><span class="status-dot"></span><span data-i18n="contact.status"></span></span>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> <span data-profile="name"></span></span>
      <span data-i18n="footer.built"></span>
      <a href="#top" class="to-top" data-magnetic><span data-i18n="footer.top"></span><i data-icon="arrow-up"></i></a>
    </div>
    <div class="footer-giant" aria-hidden="true" data-profile="name"></div>
  </footer>

  <script src="js/data.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/scroll-fx.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
