<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 | Igor Gudaniec</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#08090d">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/fonts.css">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 24px 16px;
      background:
        radial-gradient(600px circle at 50% 0%, rgba(94, 234, 212, 0.14), transparent 60%),
        #08090d;
      color: #e8eaef;
      font-family: "Inter", system-ui, sans-serif;
      text-align: center;
    }
    .code {
      margin: 0;
      color: transparent;
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(120px, 30vw, 240px);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.06em;
      -webkit-text-stroke: 2px rgba(232, 234, 239, 0.55);
    }
    .code span { color: #5eead4; -webkit-text-stroke: 0; }
    h1 { margin: 24px 0 8px; font-family: "Space Grotesk", sans-serif; font-size: clamp(26px, 5vw, 36px); letter-spacing: -0.02em; }
    p { max-width: 440px; margin: 0 auto 32px; color: #8f98ab; font-size: 17px; line-height: 1.6; }
    .en { display: block; margin-top: 4px; color: #7f889c; font-size: 15px; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 52px;
      padding: 0 26px;
      border-radius: 999px;
      background: #5eead4;
      color: #032019;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.25s;
    }
    a:hover { background: #99f6e4; }
    a:focus-visible { outline: 2px solid #5eead4; outline-offset: 3px; }
    .mono { margin-top: 40px; color: #7f889c; font-family: "JetBrains Mono", monospace; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">4<span>0</span>4</p>
    <h1>Tej strony nie ma</h1>
    <p>Link mógł się zmienić albo zawierać literówkę.<span class="en" lang="en">This page doesn't exist.</span></p>
    <a href="/">← Wróć na stronę główną</a>
    <p class="mono">igor@gdansk:~$ cd /</p>
  </main>
</body>
</html>
